services:
  api:
    build: ./backend
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - redis
    restart: unless-stopped

  browser:
    build: ./browser-engine
    environment:
      DIH_SESSION_LIMIT: ${DIH_SESSION_LIMIT:-1}
    shm_size: "1gb"
    restart: unless-stopped
    # Keep browser control ports private; do not publish them publicly.

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
